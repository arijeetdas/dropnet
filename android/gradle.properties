org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Give every APK of a release the same versionCode. By default
# `--split-per-abi` adds 1000/2000/4000 per ABI, so an installed arm64 build
# (e.g. 2025) is "newer" than the next Universal build (26), and Android
# refuses the update with "App not installed as package conflicts with an
# existing package". Read by the Flutter Gradle plugin.
force-version-code-ignoring-abi=true
